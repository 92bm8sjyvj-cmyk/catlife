<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>授權完成 Authorization complete｜project.cat.life</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:#faf7f2;color:#2b2b2b;line-height:1.75}
main{max-width:640px;margin:0 auto;padding:40px 20px 60px}h1{font-size:1.5rem;margin:0 0 4px}.en{color:#777;font-size:.9rem;margin-top:4px}
.card{background:#fff;border-radius:14px;padding:20px 22px;margin:20px 0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.meta{color:#999;font-size:.85rem}a{color:#b5651d}nav{margin-top:28px;font-size:.9rem}nav a{margin-right:14px}
.code{font-family:ui-monospace,Menlo,monospace;background:#f3efe8;border:1px solid #e3dccf;border-radius:10px;padding:12px;word-break:break-all;margin:10px 0;min-height:44px}
button{background:#2b2b2b;color:#fff;border:0;border-radius:10px;padding:10px 18px;font-size:1rem;cursor:pointer}.note{color:#b03a2e;font-size:.95rem}
</style>
</head>
<body><main>
<h1>授權完成，可以關掉這頁了</h1>
<p class="en">Authorization complete. You can close this page.</p>
<div class="card" id="box">
<p>授權碼 <span class="en">Authorization code</span></p>
<div class="code" id="code">（網址裡沒有授權碼）<span class="en"> No code found in the URL.</span></div>
<button id="copy" type="button">複製 Copy</button>
<span id="ok" class="meta" style="margin-left:10px"></span>
<p class="note">請用 Finley 的安全欄位貼上，不要貼在聊天裡</p>
<p class="en">Paste it only into Finley's secure field, never into the chat.</p>
</div>
<script>
(function(){
  var p = new URLSearchParams(location.search);
  var c = (p.get('code') || '').replace(/#_$/, '');
  var err = p.get('error_description') || p.get('error');
  var el = document.getElementById('code'), btn = document.getElementById('copy'), ok = document.getElementById('ok');
  if (c) { el.textContent = c; }
  else { btn.disabled = true; btn.style.opacity = .4; if (err) el.textContent = '錯誤 Error: ' + err; }
  btn.addEventListener('click', function(){
    var done = function(){ ok.textContent = '已複製 Copied'; };
    if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(c).then(done, fallback); } else { fallback(); }
    function fallback(){ var t=document.createElement('textarea'); t.value=c; document.body.appendChild(t); t.select(); try{document.execCommand('copy'); done();}catch(e){} document.body.removeChild(t); }
  });
})();
</script>
</main></body></html>
